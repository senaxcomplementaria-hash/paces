<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

        </div>
    </main>

    <!-- Footer -->

    </footer>

    <script>
        const slides = [
            {
                type: "image",
                name: "Andres Felipe Castaño López",
                formation: "Análisis y Desarrollo de Software",
                title: "A la espera de nuevos comienzos",
                story: "La paz no siempre comienza con grandes acontecimientos; a veces nace en el silencio, en una pausa o en la oportunidad de pensar en aquello que podemos cambiar.\n\nEn aquel lugar, mientras el cielo permanecía nublado y la lluvia amenazaba con llegar, una persona observaba en silencio. Era un espacio tranquilo que parecía guardar la esperanza de un futuro diferente.\n\nA veces, la vida nos enfrenta a momentos difíciles, donde las diferencias, los desacuerdos y las heridas parecen alejarnos unos de otros. Sin embargo, siempre existe la posibilidad de detenernos, reflexionar y encontrar nuevos caminos para seguir adelante.\n\nCon el paso del tiempo, las pequeñas acciones pueden transformar grandes realidades. Una conversación puede sanar una diferencia, un gesto de solidaridad puede devolver la esperanza y una oportunidad puede cambiar el rumbo de una historia.\n\nQuizás aquel día no sería diferente para el mundo, pero sí podría ser el comienzo de algo nuevo para quienes decidieran dejar atrás sus rencores y construir un futuro basado en el respeto y la comprensión.\n\nPorque incluso después de los días más grises, siempre existe la posibilidad de volver a empezar.\n\nEstamos a la espera de nuevos comienzos, pero la paz no tiene que esperar: podemos empezar a construirla desde hoy.",
                image: "img/Imagen1.jpg"
            },
            {
                type: "image",
                name: "Pablo C Cifuentes",
                formation: "Coordinador Sistemas Integrados de Gestión",
                title: "Entre el cielo y la tierra",
                story: "Porque entre el cielo que nos inspira y la tierra que nos sostiene, existe un espacio sagrado donde ocurre la verdadera transformación: Nuestro propio ser.",

            },
            {
                type: "image",
                name: "Mariana Galindo",
                formation: "Sistemas Integrados de Gestión",
                title: "El camino de la resiliencia",
                story: "Para mí transmite paz, tranquilidad y conocimiento. Es donde paso la mayor parte del tiempo estudiando, y cada vez que lo recorro me recuerda mi proceso de crecimiento.\n\nEl camino largo y techado representa la resiliencia, avanzar paso a paso, aunque cueste. Y el jardín con las flores y el cielo abierto me da calma cuando estoy estresada.\n\nEs más que un pasillo, es parte de mi crecimiento personal en el SENA.",
                image: "img/Imagen3.jpg"
            },
            {
                type: "image",
                name: "Alejandro Ospina Vargas",
                formation: "Automotriz",
                title: "En Busca de Paz",
                story: "Durante una actividad grupal en la noche, un grupo de compañeros se encontraba reunido cerca de unas rocas. Mientras compartían, algunos comenzaron a discutir porque tenían diferentes opiniones sobre cómo realizar la actividad.\n\nAl ver que la situación se estaba complicando, uno de los compañeros decidió intervenir. Les pidió que se tranquilizaran, escuchó las opiniones de todos y propuso que buscaran una solución entre todos, sin necesidad de discutir.\n\nPoco a poco, el grupo recuperó la tranquilidad y comprendió que era mejor trabajar unidos que competir o enfrentarse. Al final, todos lograron ponerse de acuerdo y continuar con la actividad.\n\nEsta experiencia nos enseñó que el liderazgo no significa dar órdenes, sino tener la capacidad de mantener la calma, escuchar a los demás y ayudar a resolver los conflictos. También nos demostró que la paz se construye con respeto, diálogo y trabajo en equipo.",
                image: "img/Imagen4.png"
            },
            {
                type: "image",
                name: "Brandon Stiven Marín Ospina",
                formation: "Automotriz",
                title: "Las paces también se construyen compartiendo",
                story: "Un puesto de comida en la calle puede convertirse en un lugar de encuentro para la comunidad, donde las personas no solo llegan a comprar, sino también a compartir momentos y relacionarse con los demás. Estos espacios permiten conocer diferentes personas, intercambiar experiencias y fortalecer la convivencia.\n\nA través de un negocio como este se generan oportunidades de empleo, apoyo a las familias y unión entre vecinos. De esta manera, con el respeto, la amabilidad, la colaboración y el trabajo honesto, podemos construir paces desde las pequeñas acciones de nuestra vida cotidiana.",
                image: "img/Imagen5.png"
            },
            {
                type: "image",
                name: "Federico Palacio",
                formation: "Automotriz",
                title: "Un puesto de comida callejera: un espacio para construir paz",
                story: "En la imagen podemos observar un grupo de personas reunidas alrededor de un puesto de comida callejera. Este tipo de espacios, aunque parecen cotidianos, pueden convertirse en lugares donde se construye paz, porque permiten que personas diferentes compartan, conversen y se relacionen en un ambiente de respeto y tranquilidad.\n\nUn puesto de comida no solamente representa una oportunidad para generar ingresos y ayudar al sustento de una familia, sino que también crea comunidad. A través de la compra y venta de alimentos se generan relaciones entre vendedores, estudiantes y ciudadanos, se apoya el trabajo de otras personas y se fortalecen valores como la solidaridad, la empatía y la colaboración.\n\nConsidero que construir paz también está en estas pequeñas acciones de la vida diaria: apoyar a los trabajadores informales, tratar bien a los demás, respetar las diferencias y compartir con otras personas. Así, un simple puesto de comida callejera puede convertirse en un punto de encuentro donde nacen amistades, oportunidades y una mejor convivencia social.",
                image: "img/Imagen6.jpg"
            },
            {
                type: "image",
                name: "Luis Miguel Restrepo",
                formation: "Sistemas Integrados de Gestión",
                title: "Forjando Nuevos Comienzos",
                story: "En este ambiente de soldadura, donde el metal se moldea, se realizan uniones y se transforman ideas, cada día surgen nuevas oportunidades. Más allá de las herramientas, encontramos las habilidades, la paciencia y la precisión de quienes aprenden. Hay historias de vida que se transforman con esta labor diaria, demostrando que la confianza, la perseverancia y la valentía pueden convertirse en instrumentos más poderosos que los propios hornos.\n\nEn los procesos de resocialización y reintegración social, también se construye con el alma y el corazón. Es aquí donde los productos cuentan su historia y el metal adquiere un verdadero valor: cuando contribuye a construir un futuro diferente.\n\nPORQUE LA PAZ TAMBIÉN SE CONSTRUYE CUANDO UNA SOCIEDAD OFRECE OPORTUNIDADES PARA APRENDER, CAMBIAR Y VOLVER A EMPEZAR.",
                image: "img/Imagen7.png"
            },
            {
                type: "image",
                name: "Ana Sofia Velazco Agudelo",
                formation: "Dibujo Modelado y arquitectonico",
                title: "En la diferencia florece la paz",
                story: "La paz no llega haciendo ruido, crece como algo silencioso en los pequeños encuentros del día a día y en las manos que se unen para crear juntas un lugar donde florecer.\n\nCada mente es un universo diferente, con distintas formas de vivir, pensar y distintos talentos, es en esa diversidad donde reside nuestra riqueza, todo lo que podemos aprender a través del otro y lo que juntos somos capaces de lograr.\n\nConstruir paz no se trata de encontrar personas que se parezcan a nosotros, sino aprender a explotar el potencial de cada persona y caminar al lado de quienes nos muestran otras formas de ver el mundo. Es ahí donde descubrimos que nuestras diferencias son raíces, no fronteras.",

            {

                title: "Un refugio en la llovizna",
                story: "Eran las 3:37 de la tarde de un viernes. Desde muy temprano el día estuvo acompañado de diversas lloviznas y de un ambiente muy frío; sin embargo, en ese momento y en ese lugar, la frialdad desaparecía.\n\nEn ese receso, pequeño pero significativo, existía una pausa que el clima no podía modificar: el placer de compartir con compañeros con los cuales se tiene un objetivo en común. Distintas realidades y distintos orígenes coincidían en aquella tarde gris para intercambiar experiencias, pensamientos y vivencias. Más allá de la relación de aprendices que los unía, en ese instante bajo las sombrillas, no importaba nada más.\n\nAunque todos viven una realidad distinta fuera de ese lugar, y al acabar la jornada cada quien vuelve a sus quehaceres, ese momento les permite disfrutar de una tranquilidad y armonía que por fuera a veces no tienen. Ese espacio les permite vivir las experiencias de los otros; en ese momento, las diferencias se desvanecen y, simplemente, somos nosotros.",

            },
            {
                type: "image",

                title: "El Poder de la Unión",
                story: "El sol iluminaba el centro de formación mientras la actividad avanzaba. El salón se había dividido en dos grupos: uno ya había terminado, mientras el otro aún tenía trabajo por hacer. Sin dudarlo, quienes habían finalizado se acercaron a ayudar a sus compañeros.\n\nEntre risas, esfuerzo y colaboración, ambos grupos trabajaron unidos hasta alcanzar el objetivo. Porque el compañerismo no consiste en terminar primero, sino en entender que los logros son más valiosos cuando nadie se queda atrás.",
                image: "img/Imagen10.jpg"
            },
            {
                type: "image",
                name: "Brahian García Marín",
                formation: "Automotriz",
                title: "La ley de Murphy",
                story: "Para avanzar hacia el futuro no podemos ignorar el camino recorrido. Como el espejo retrovisor que nos permite ver lo que queda atrás sin detener nuestra marcha, el verdadero proceso de reconciliación en el SENA nos invita a mirar los conflictos del pasado no para quedarnos atrapados en ellos, sino para transitar con madurez hacia la convivencia. Romper las rejas de los prejuicios y limpiar la mirada es el primer paso para construir una comunidad en paz.",
                image: "img/Imagen11.jpg"
            },
            {
                type: "image",
                name: "Maria José",
                formation: "Dibujo Modelado y arquitectonico",
                title: "Un lugar para compartir también es un lugar para construir paz",
                story: "Era una mañana soleada y varios jóvenes se encontraban reunidos alrededor de una mesa, bajo unas grandes sombrillas. En aquel espacio, rodeado de zonas verdes y edificios, compartían un momento de descanso, conversaban y disfrutaban de la compañía de los demás.\n\nAlgunos hablaban mientras otros escuchaban. Aunque cada uno podía tener preocupaciones o dificultades personales, ese momento les permitía sentirse acompañados y olvidar por un instante sus problemas. A veces, una conversación, una sonrisa o simplemente compartir con alguien puede hacer una gran diferencia.\n\nEsta fotografía nos muestra que la construcción de paz también comienza con acciones sencillas. Compartir con los demás, escuchar y brindar compañía ayuda a crear espacios más seguros y tranquilos, donde todos puedan sentirse aceptados e incluidos.\n\nPorque construir paz no siempre requiere grandes acciones; muchas veces comienza con algo tan simple como sentarse junto a alguien y hacerle sentir que no está solo.",
                image: "img/Imagen12.jpg"
            },
            {
                type: "image",
                name: "Natalia Agudelo",
                formation: "Formación Institucional",

                story: "Para mí, construir paz va mucho más allá: empieza en la manera en que tratamos a las personas, en cómo nos dirigimos a los demás y en la capacidad que tenemos de entender que cada compañero carga consigo una historia, unas dificultades, unos sueños y una forma diferente de ver la vida.\n\nCreo que uno de los valores más importantes para construir una comunidad en paz es la empatía. A veces nos acostumbramos tanto a mirar nuestras propias necesidades que olvidamos que al lado nuestro hay alguien que también merece ser escuchado, comprendido y respetado. No siempre tenemos que estar de acuerdo con los demás, pero sí tenemos la responsabilidad de aprender a respetar sus opiniones, sus diferencias y su dignidad.\n\nTambién considero importante entender que ningún cargo, conocimiento o posición nos hace superiores a otra persona. Tener autoridad no significa tener derecho a pasar por encima de los demás, imponer nuestras ideas, humillar o hacer sentir menos a alguien. Al contrario, entre más responsabilidad tengamos, más humildad y respeto deberíamos demostrar. Porque el verdadero liderazgo no se mide por el poder que tenemos sobre otros, sino por la manera en que somos capaces de orientar, escuchar y aportar sin hacer sentir pequeño a nadie.\n\nEn el centro compartimos espacios con personas de diferentes edades, pensamientos, costumbres y experiencias. Precisamente ahí está la oportunidad de aprender que la convivencia no consiste en pensar igual, sino en encontrar la manera de caminar juntos a pesar de nuestras diferencias. Una palabra puede motivar, pero también puede herir; un gesto puede hacer sentir bienvenida a una persona o hacerla sentir excluida. Por eso, debemos ser más conscientes de lo que decimos y hacemos.\n\nPara mí, la paz no se construye únicamente con grandes acciones ni con discursos bonitos. Se construye en lo cotidiano: cuando escuchamos antes de juzgar, cuando reconocemos nuestros errores, cuando ofrecemos una disculpa sincera, cuando no utilizamos nuestras posiciones para intimidar y cuando elegimos tratar a los demás con la misma dignidad con la que esperamos ser tratados.\n\nAl final, todos estamos aquí para aprender, crecer y convertirnos en mejores personas y profesionales. Y ojalá no nos llevemos del centro solamente conocimientos para desempeñarnos en un trabajo, sino también lecciones para la vida: que nunca se nos olvide ser humanos, que el respeto no se negocia y que nadie necesita sentirse más grande haciendo sentir pequeño a otro.\n\nPorque construir paz es entender que podemos tener diferentes opiniones, diferentes responsabilidades y diferentes caminos, pero nunca debemos olvidar que todos merecemos el mismo respeto.",

        let currentIndex = 0;

        function renderSlide() {

            const leftPanel = document.getElementById('left-panel');
            
            if (slide.type === "download") {
                leftPanel.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center p-6 sm:p-8 h-full z-20">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>

                        </div>

                            </svg>
                            <span>Descargar PEPAS.docx</span>
                        </a>
                    </div>
                `;

            } else {

                    <div id="image-caption" class="absolute bottom-4 sm:bottom-6 left-4 sm:left-6 right-4 sm:right-6 z-30 pointer-events-none">
                        <span id="slide-formation" class="inline-block bg-emerald-500/25 text-emerald-300 border border-emerald-500/40 text-xs sm:text-sm font-semibold px-3 py-1 rounded-full mb-2 shadow-md">${slide.formation}</span>
                        <h2 id="slide-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-white leading-tight drop-shadow-md">${slide.title}</h2>
                        <p id="slide-author" class="text-slate-200 text-sm sm:text-base mt-1 font-medium drop-shadow">Por: ${slide.name}</p>
                    </div>
                `;
                document.getElementById('panel-category').textContent = "Relato de la Obra";
            }

            document.getElementById('slide-story').textContent = slide.story;
            document.getElementById('slide-counter').textContent = `${currentIndex + 1} / ${slides.length}`;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            renderSlide();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            renderSlide();
        }

        // Initialize
        renderSlide();
    </script>
</body>

</html>
